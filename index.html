```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ESP32 - Monitor de Água</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            color: #94a3b8;
        }

        /* STATUS MQTT */

        .connection {
            background: #1e293b;
            border-radius: 15px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 13px;
            height: 13px;
            background: #ef4444;
            border-radius: 50%;
        }

        .status-dot.connected {
            background: #22c55e;
        }

        /* CARDS */

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: #1e293b;
            border-radius: 18px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .card h2 {
            font-size: 17px;
            color: #94a3b8;
            margin-bottom: 15px;
        }

        .value {
            font-size: 42px;
            font-weight: bold;
        }

        .unit {
            color: #94a3b8;
            font-size: 18px;
        }

        /* BARRA */

        .level-card {
            background: #1e293b;
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 25px;
        }

        .level-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .progress {
            width: 100%;
            height: 28px;
            background: #334155;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #22c55e;
            border-radius: 20px;
            transition: width 0.5s ease;
        }

        /* LED */

        .led-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 18px;
            text-align: center;
            margin-bottom: 25px;
        }

        .led {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #334155;
            margin: 20px auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.4);
            transition: 0.3s;
        }

        .led.on {
            background: #ef4444;
            box-shadow:
                0 0 15px #ef4444,
                0 0 35px #ef4444,
                0 0 60px #ef4444;
        }

        .led-status {
            font-size: 24px;
            font-weight: bold;
        }

        /* BOTÕES */

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 14px 30px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.04);
        }

        .btn-on {
            background: #22c55e;
            color: white;
        }

        .btn-off {
            background: #ef4444;
            color: white;
        }

        /* LOG */

        .log {
            background: #020617;
            border-radius: 15px;
            padding: 20px;
        }

        .log h3 {
            margin-bottom: 12px;
        }

        #log {
            height: 150px;
            overflow-y: auto;
            color: #94a3b8;
            font-family: monospace;
            font-size: 13px;
        }

        /* RESPONSIVO */

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 25px;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <header>

        <h1>💧 Monitor de Água</h1>

        <p>
            ESP32 + JSN-SR04T + HiveMQ
        </p>

    </header>


    <!-- STATUS MQTT -->

    <div class="connection">

        <div class="connection-status">

            <div
                id="statusDot"
                class="status-dot">
            </div>

            <span id="connectionText">
                Desconectado
            </span>

        </div>

        <span>
            MQTT / WSS
        </span>

    </div>


    <!-- CARDS -->

    <div class="cards">

        <div class="card">

            <h2>Distância</h2>

            <div>

                <span
                    id="distance"
                    class="value">
                    -- 
                </span>

                <span class="unit">
                    cm
                </span>

            </div>

        </div>


        <div class="card">

            <h2>Nível</h2>

            <div>

                <span
                    id="percentage"
                    class="value">
                    --
                </span>

                <span class="unit">
                    %
                </span>

            </div>

        </div>


        <div class="card">

            <h2>LED GPIO 2</h2>

            <div>

                <span
                    id="ledText"
                    class="value">
                    OFF
                </span>

            </div>

        </div>

    </div>


    <!-- BARRA DE NIVEL -->

    <div class="level-card">

        <div class="level-header">

            <strong>
                Nível do reservatório
            </strong>

            <strong id="percentageBar">
                0%
            </strong>

        </div>

        <div class="progress">

            <div
                id="progressBar"
                class="progress-bar">
            </div>

        </div>

    </div>


    <!-- CONTROLE LED -->

    <div class="led-card">

        <h2>
            Controle do LED
        </h2>

        <div
            id="led"
            class="led">
        </div>

        <div
            id="ledStatus"
            class="led-status">

            Desligado

        </div>


        <div class="buttons">

            <button
                class="btn-on"
                onclick="ligarLED()">

                LIGAR LED

            </button>


            <button
                class="btn-off"
                onclick="desligarLED()">

                DESLIGAR LED

            </button>

        </div>

    </div>


    <!-- LOG -->

    <div class="log">

        <h3>
            Comunicação
        </h3>

        <div id="log"></div>

    </div>

</div>


<!-- MQTT -->

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>


<script>

    // =====================================================
    // CONFIGURAÇÃO HIVEMQ
    // =====================================================

    const MQTT_HOST =
        "wss://d7fd89e5e9b44d38b2a248bb67d9e159.s1.eu.hivemq.cloud:8884/mqtt";


    const MQTT_USER =
        "ESP-Agua";


    const MQTT_PASSWORD =
        "02010712";


    // =====================================================
    // TOPICOS
    // =====================================================

    const TOPICO_DISTANCIA =
        "esp32/agua/distancia";


    const TOPICO_PERCENTUAL =
        "esp32/agua/percentual";


    const TOPICO_LED =
        "esp32/agua/led";


    const TOPICO_COMANDO_LED =
        "esp32/agua/led/comando";


    // =====================================================
    // ELEMENTOS
    // =====================================================

    const distanceElement =
        document.getElementById("distance");


    const percentageElement =
        document.getElementById("percentage");


    const percentageBar =
        document.getElementById("percentageBar");


    const progressBar =
        document.getElementById("progressBar");


    const led =
        document.getElementById("led");


    const ledText =
        document.getElementById("ledText");


    const ledStatus =
        document.getElementById("ledStatus");


    const statusDot =
        document.getElementById("statusDot");


    const connectionText =
        document.getElementById("connectionText");


    const logElement =
        document.getElementById("log");


    // =====================================================
    // LOG
    // =====================================================

    function adicionarLog(mensagem) {

        const hora =
            new Date().toLocaleTimeString();

        logElement.innerHTML +=
            `[${hora}] ${mensagem}<br>`;

        logElement.scrollTop =
            logElement.scrollHeight;
    }


    // =====================================================
    // CONECTAR MQTT
    // =====================================================

    const client = mqtt.connect(
        MQTT_HOST,
        {

            username: MQTT_USER,

            password: MQTT_PASSWORD,

            clientId:
                "WEB-" +
                Math.random()
                    .toString(16)
                    .substring(2),

            clean: true,

            reconnectPeriod: 3000,

            connectTimeout: 10000

        }
    );


    // =====================================================
    // CONECTADO
    // =====================================================

    client.on("connect", function() {

        console.log("MQTT conectado");

        statusDot.classList.add("connected");

        connectionText.innerText =
            "Conectado ao HiveMQ";

        adicionarLog(
            "Conectado ao HiveMQ."
        );


        // ASSINAR TOPICOS

        client.subscribe(
            TOPICO_DISTANCIA
        );

        client.subscribe(
            TOPICO_PERCENTUAL
        );

        client.subscribe(
            TOPICO_LED
        );


        adicionarLog(
            "Inscrito nos tópicos do ESP32."
        );

    });


    // =====================================================
    // RECEBER MENSAGENS
    // =====================================================

    client.on("message", function(topic, message) {

        const valor =
            message.toString();


        adicionarLog(
            topic + " → " + valor
        );


        // DISTANCIA

        if (topic === TOPICO_DISTANCIA) {

            const distancia =
                parseFloat(valor);

            if (!isNaN(distancia)) {

                distanceElement.innerText =
                    distancia.toFixed(2);

            }

        }


        // PORCENTAGEM

        if (topic === TOPICO_PERCENTUAL) {

            let porcentagem =
                parseInt(valor);

            if (!isNaN(porcentagem)) {

                porcentagem =
                    Math.max(
                        0,
                        Math.min(
                            100,
                            porcentagem
                        )
                    );


                percentageElement.innerText =
                    porcentagem;


                percentageBar.innerText =
                    porcentagem + "%";


                progressBar.style.width =
                    porcentagem + "%";

            }

        }


        // LED

        if (topic === TOPICO_LED) {

            atualizarLED(
                valor
            );

        }

    });


    // =====================================================
    // ATUALIZAR LED
    // =====================================================

    function atualizarLED(valor) {

        const estado =
            valor.toUpperCase();


        if (
            estado === "ON" ||
            estado === "LIGADO"
        ) {

            led.classList.add("on");

            ledText.innerText =
                "ON";

            ledStatus.innerText =
                "Ligado";

        }

        else {

            led.classList.remove("on");

            ledText.innerText =
                "OFF";

            ledStatus.innerText =
                "Desligado";

        }

    }


    // =====================================================
    // LIGAR LED
    // =====================================================

    function ligarLED() {

        if (!client.connected) {

            alert(
                "O site não está conectado ao HiveMQ."
            );

            return;
        }


        client.publish(
            TOPICO_COMANDO_LED,
            "ON"
        );


        adicionarLog(
            "Comando enviado: LIGAR LED"
        );

    }


    // =====================================================
    // DESLIGAR LED
    // =====================================================

    function desligarLED() {

        if (!client.connected) {

            alert(
                "O site não está conectado ao HiveMQ."
            );

            return;
        }


        client.publish(
            TOPICO_COMANDO_LED,
            "OFF"
        );


        adicionarLog(
            "Comando enviado: DESLIGAR LED"
        );

    }


    // =====================================================
    // ERRO
    // =====================================================

    client.on("error", function(error) {

        console.error(error);

        adicionarLog(
            "Erro MQTT: " + error.message
        );

    });


    // =====================================================
    // DESCONECTADO
    // =====================================================

    client.on("close", function() {

        statusDot.classList.remove(
            "connected"
        );

        connectionText.innerText =
            "Desconectado";

        adicionarLog(
            "MQTT desconectado. Tentando reconectar..."
        );

    });


    // =====================================================
    // OFFLINE
    // =====================================================

    client.on("offline", function() {

        adicionarLog(
            "Cliente MQTT offline."
        );

    });

</script>

</body>

</html>
